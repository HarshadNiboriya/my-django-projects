<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% include 'header.html' %}


<div align="center">
    <hr>
    <form method="POST">
        {% csrf_token %}
        <table>
            <tr>
                <th>Firstname:</th>
                <td><input type="text" name="firstName"></td>
            </tr>

            <tr>
                <th>Lastname:</th>
                <td><input type="text" name="lastName"> </td>
            </tr>

            <tr>
                <th>Loginid:</th>
                <td><input type="text" name="loginId"></td>
            </tr>

            <tr>
                <th> Password:</th>
                <td><input type="text" name="password"></td>
            </tr>

             <tr>
                <th>DOB:</th>
                <td><input type="text" name="dob"></td>
            </tr>

            <tr>
                <th>Address:</th>
                <td><input type="text" name="address"></td>
            </tr>

            <tr>
                <th></th>
                <td><input type="submit" value="signin"></td>
            </tr>
        </table>
    </form>
</div>

</body>
</html>
