<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

{% include 'header.html' %}

<div class="container d-flex justify-content-center align-items-center"
     style="min-height: 85vh;">

    <div class="card shadow border-0 rounded-4 p-4" style="width: 380px;">

        <h2 class="text-center text-primary fw-bold">Welcome Back!</h2>
        <p class="text-center text-muted">Login to your account</p>

        <!-- Login Message -->
        {% if form.error %}
        <p class="text-center text-danger fw-bold">
            {{ form.message }}
        </p>
        {% else %}
        <p class="text-center text-success fw-bold">
            {{ form.message }}
        </p>
        {% endif %}

        <form method="POST" autocomplete="off">
            {% csrf_token %}

            <!-- Login ID -->
            <input type="text"
                   name="loginId"
                   class="form-control form-control-lg mb-1"
                   placeholder="Enter Login ID"
                   value="{{ form.login_id }}"
                   autocomplete="off">

            <small class="text-danger">
                {{ form.input_error.login_id }}
            </small>

            <!-- Password -->
            <input type="password"
                   name="password"
                   class="form-control form-control-lg mt-3 mb-1"
                   placeholder="Enter Password"
                   value="{{ form.password }}"
                   autocomplete="off">

            <small class="text-danger">
                {{ form.input_error.password }}
            </small>

            <!-- Forgot Password -->
            <div class="text-end mt-2">
                <a href="/ors/ForgetPassword/"
                   class="text-decoration-none">
                    Forgot Password?
                </a>
            </div>

            <!-- Login Button -->
            <button type="submit"
                    name="operation"
                    value="signIn"
                    class="btn btn-primary btn-lg w-100 mt-3">
                Login
            </button>

            <!-- Signup -->
            <p class="text-center mt-3 mb-0">
                Don't have an account?
                <a href="/ors/Registration/"
                   class="text-decoration-none">
                    Sign Up
                </a>
            </p>

        </form>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
